# Bramka anonimizacji — skanuje CAŁE repozytorium, nie tylko to, co zmienił PR.
#
# DLACZEGO cały repo, a nie diff: materiał ma być SAMODZIELNY. Nazwa własna, numer projektu albo identyfikator
# zgłoszenia mogą wejść tu commitem sprzed miesiąca i nikt ich nie zobaczy, bo diff bieżącego PR-a jest czysty.
# Skan całości kosztuje sekundy i jest jedyną wersją, która cokolwiek gwarantuje.
#
# DLACZEGO to jest bramka, a nie checklista: repozytorium jest publiczne. Kontrola, która polega na tym, że
# ktoś pamięta ją uruchomić, nie jest kontrolą — a tutaj koszt pomyłki to ujawnienie, którego nie da się cofnąć
# (git zachowuje historię, forki i cache wyszukiwarek też).

name: samodzielnosc

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skan:
    name: zero nazw wlasnych i identyfikatorow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Skaner jest czystym Pythonem bez zależności — celowo, żeby dało się go uruchomić wszędzie, także
      # na katalogu, do którego materiał zostanie skopiowany razem z czymś innym.
      - name: skan samodzielnosci
        run: python3 selftest/skan_samodzielnosci.py .
